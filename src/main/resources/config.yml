weekly-quest-count: 3
# Период в часах с привязкой к времени суток ниже; 168 — раз в неделю.
weekly-refresh-hours: 168
# Время обновления по Москве (Europe/Moscow), формат ЧЧ:ММ.
weekly-refresh-time: "16:00"

displays:
  # Objects are plain click zones: only the size of the hitbox is configured, no model is built.
  central-tower:
    hitbox-width: 1
    hitbox-height: 1
  # One hitbox for all numbered calibration towers (tower-1 ... tower-16).
  calibration-tower:
    hitbox-width: 1
    hitbox-height: 1
  # One hitbox for all computers (computer-1 ... computer-16).
  chunk-tower:
    hitbox-width: 1
    hitbox-height: 1

menus:
  item-model: quack_gui:paper
  # Скрывает всплывающую подсказку у предмета в слоте 0 во всех меню (Paper setHideTooltip).
  hide-slot0-tooltip: true
  tower:
    title: <dark_gray>Доступные задания
    size: 54
    material: PAPER
    item-model: quack_gui:paper
    info-model: comp_gui
    central-model: centre_icon
    towers:
      unavailable: tower_icon
      available: tower_task_icon
      in-progress: tower_task_icon
      story: tower_story_icon
      available-name: <i:false><aqua>Вышка [{tower}]
      available-lore:
        - <i:false><gray>Обнаружена аномалия
        - "<i:false><gray>Координаты: </gray><aqua>[{x} {z}]"
        - <i:false><gray>Взяться за задание | </gray><aqua>ЛКМ
      unavailable-name: <i:false><green>Вышка [{tower}]
      unavailable-lore:
        - <i:false><gray>Ничего не выявлено
        - "<i:false><gray>Координаты: </gray><green>[{x} {z}]"
      in-progress-name: <i:false><aqua>Вышка [{tower}]
      in-progress-lore:
        - <i:false><gray>Обнаружена аномалия
        - "<i:false><gray>Координаты: </gray><aqua>[{x} {z}]"
        - <i:false><aqua>Задание активно!
    info-name: <yellow>Еженедельные задания
    info-lore:
      - <gray>Каждую неделю доступны три вышки
    central-name: <i:false><green>Вышка [Центрий]
    central-lore:
      - "<i:false><gray>До обновления заданий: </gray><aqua>[{time}]"
    # Формат общего таймера до следующего обновления заданий ({days} {hours} {minutes}).
    central-time-format: "{days}д {hours}ч {minutes}м"
  calibration:
    title: <dark_gray>Калибровка вышки
    size: 27
    material: PAPER
    item-model: quack_gui:paper
    slot0-model: colib_gui
    # Скрывает всплывающую подсказку у всех предметов меню калибровки (как hide-slot0-tooltip, но для всего меню).
    hide-tooltips: true
    stage-models:
      - colib_complite0
      - colib_complite1
      - colib_complite2
      - colib_complite3
    real-model: button_light
    fake-model: button_light1
    slot0-name: <yellow>Калибровка
    slot0-lore:
      - <gray>Найдите нужные бумаги
    stage-name: <yellow>Этап {stage} из {stages}
    stage-lore:
      - <gray>Текущий этап калибровки
    real-name: <white>Бумага
    real-lore:
      - <gray>Нажмите на бумагу
    fake-name: <gray>Бумага
    fake-lore:
      - <gray>Нажмите на бумагу
  chunk-map:
    title: <dark_gray>Определение чанка
    size: 54
    material: PAPER
    item-model: quack_gui:paper
    info-model: comp_gui
    sector-model: sector_icon
    found-model: sector_task_icon
    computer-model: centre_icon
    preview-model: sector_icon
    preview-computer-model: centre_icon
    assigned-model: sector_block_icon
    assigned-computer-model: centre_block_icon
    info-name: <yellow>Определение чанка
    info-lore:
      - "<gray>Область: {grid-size}×{grid-size} секторов"
      - "<gray>Сектор: {sector-size}×{sector-size} чанков"
    sector-name: <i:false><green>Сектор {sector}
    sector-lore:
      - "<i:false><gray>Центральный чанк: </gray><green>[{x} {z}]"
    found-name: <i:false><aqua>Сектор {sector}
    found-lore:
      - "<i:false><gray>Центральный чанк: </gray><aqua>[{x} {z}]"
      - "<i:false><gray>Найдена аномалия: </gray><aqua>[{wave-x} {wave-z}]"
    computer-name: <i:false><green>Центральный сектор
    computer-lore:
      - "<i:false><gray>Центральный чанк: </gray><green>[{x} {z}]"
      - <i:false><gray>Вы здесь.
    preview-computer-name: <i:false><green>Центральный сектор
    preview-computer-lore:
      - "<i:false><gray>Центральный чанк: </gray><green>[{x} {z}]"
      - <i:false><gray>Вы здесь.
    preview-name: <i:false><green>Сектор {sector}
    preview-lore:
      - "<i:false><gray>Центральный чанк: </gray><green>[{x} {z}]"
    assigned-computer-name: <i:false><red>Центральный сектор
    assigned-computer-lore:
      - <i:false><red>Требуется калибровка
    assigned-name: <i:false><red>Сектор {sector}
    assigned-lore:
      - <i:false><red>Требуется калибровка

calibration:
  stages: 3
  papers-per-stage: 5
  real-per-stage: 2
  display-ticks: 30

chunk-area:
  # Волны выбираются в пределах меню (5×5 секторов); большее значение обрезается до 5.
  grid-size: 5
  # Размер сектора в чанках. Сектор компьютера (центр карты) не используется: разлом и волна
  # всегда появляются в одном из остальных 24 секторов, выбранном случайно.
  sector-size: 20
  waves: 3
  # Пауза между волнами, в секундах. Следующая волна начинается через случайное время из этого
  # диапазона: так волны не накрывают друг друга сразу.
  wave-interval-min-seconds: 5
  wave-interval-max-seconds: 7

# Мобы CustomMob добавляются в mobs, например: 'custom:pumpkin_soul': { counts: [0, 1, 2] }
# Доступны skelebass, dancebomber, pumpkin, pumpkin_soul, pumpkin_brute, pumpkin_poison.
wave-types:
  zombie:
    chance: 11
    # ID предметов из rift-loot, привязанных к этому типу волны.
    loot:
      - chrono_token
      - shlak
      - ars
      - imba
    mobs:
      ZOMBIE:
        counts:
          - 2
          - 4
          - 6
        # Пример: баффы при спавне (level — уровень, duration — в тиках, -1 = бесконечно).
        effects:
          - type: SPEED
            level: 2
            duration: -1
          - type: STRENGTH
            level: 2
            duration: -1
          - type: RESISTANCE
            level: 3
            duration: -1
        # Частицы вокруг моба (interval — раз в сколько тиков, speed — скорость частиц).
        # Переход цвета (только DUST / DUST_COLOR_TRANSITION): hex-цвета "#RRGGBB", size — размер.
        # Для DUST нужен только from-color; при отсутствии цвета частица спавнится без окраски.
        # Внимание: у DUST при count: 0 значение speed трактуется как яркость, поэтому count > 0.
        particles:
          - type: DUST_COLOR_TRANSITION
            count: 5
            spread: 0.3
            speed: 0
            interval: 1
            size: 0.7
            from-color: "#E6FFFF"
            to-color: "#2BA3D9"
          - type: OMINOUS_SPAWNING
            count: 3
            spread: 0.3
            speed: 0.2
            interval: 5
      SKELETON:
        counts:
          - 1
          - 2
          - 4
        effects:
          - type: STRENGTH
            level: 4
            duration: -1
          - type: SPEED
            level: 1
            duration: -1
          - type: RESISTANCE
            level: 2
            duration: -1
        particles:
          - type: DUST_COLOR_TRANSITION
            count: 5
