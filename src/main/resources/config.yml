rift:
  material: WOODEN_HOE
  item-model: WOODEN_HOE
  custom-model-data: rift
  scale: 5
  height: 15
  # Дальность отрисовки самой модели рифта, отдельно от облака частиц.
  view-distance: 64
  # Яркость разлома (0–15), чтобы модель светилась независимо от освещения.
  block-light: 15
  sky-light: 15
  # Разлом невидим, пока игрок не подойдёт ближе этого расстояния (блоки); 0 — открыться сразу.
  open-distance: 32
  # Когда открывается разлом:
  #   chunk — разлом спит, пока игрок не вошёл в его чанк (обычный режим);
  #   distance — разлом открывается, когда игрок подошёл ближе open-distance.
  open-mode: chunk
  # Облако частиц разлома: показывается всё время, пока существует разлом.
  # particles — список частиц; interval — тиков между облаками,
  # view-distance — сколько блоков видно облако; это отдельная настройка от рифта.
  # offset-x/y/z — разброс по осям в блоках, speed — скорость частиц.
  # size/from-color/to-color — данные для DUST и DUST_COLOR_TRANSITION.
  cloud:
    interval: 4
    view-distance: 128
    particles:
      - type: OMINOUS_SPAWNING
        count: 10
        offset-x: 2.5
        offset-y: 1.5
        offset-z: 2.5
        speed: 0.2
      - type: DUST_COLOR_TRANSITION
        count: 5
        offset-x: 2.5
        offset-y: 0.5
        offset-z: 2.5
        speed: 0
        size: 3
        from-color: "#E6FFFF"
        to-color: "#2BA3D9"
  # Кадры анимации: tick — смещение в тиках, x/y/z — доли от scale (1 = полный размер).
  # Открытие проигрывается один раз, когда разлом открывается.
  open-frames:
    - tick: 0
      x: 0
      y: 0
      z: 0.2
    - tick: 2
      x: 1
      y: 0
      z: 0.2
    - tick: 4
      x: 1
      y: 0.2
      z: 0.2
    - tick: 7
      x: 1
      y: 0.2
      z: 1
    - tick: 10
      x: 1
      y: 1
      z: 1
  # Пульсация зациклена; последний кадр должен совпадать с первым, иначе будет рывок.
  pulse-frames:
    - tick: 0
      x: 1
      y: 1
      z: 1
    - tick: 2
      x: 1
      y: 1.02
      z: 1.02
    - tick: 4
      x: 1.02
      y: 1.02
      z: 1
    - tick: 6
      x: 1
      y: 1
      z: 1
    - tick: 8
      x: 1
      y: 1.02
      z: 1.02
    - tick: 10
      x: 1.02
      y: 1.02
      z: 1
    - tick: 12
      x: 1
      y: 1
      z: 1
  # Закрытие при исчезновении разлома; пустой список — исчезнуть мгновенно.
  close-frames:
    - tick: 0
      x: 1
      y: 1
      z: 1
    - tick: 3
      x: 1
      y: 0.2
      z: 1
    - tick: 6
      x: 1
      y: 0.2
      z: 0.2
    - tick: 8
      x: 1
      y: 0
      z: 0.2
    - tick: 10
      x: 0
      y: 0
      z: 0.2

rift-scrolls:
  # Shared chance (%) for ONE scroll from the eligible skin-id entries, otherwise none.
  # Ordinary replaces-all loot takes priority over this group.
  chance: 50

rift-loot:
  # Optional QUACK scroll examples (uncomment and use real skin IDs from QUACK):
  # - id: common_scroll
  #   skin-id: common_skin
  #   weight: 7
  # - id: rare_scroll
  #   skin-id: rare_skin
  #   weight: 2
  # - id: legendary_scroll
  #   skin-id: legendary_skin
  #   weight: 1
  # Relative weights 7/2/1 mean 70%/20%/10% WITHIN the successful scroll group.
  # With the shared 50% chance, the final chances are 35%/10%/5% per reward roll.
  # Weights need not total 100; zero/negative/invalid weights are excluded.
  # If weight is omitted, the existing chance value is used as the relative weight.
  # Scroll chance is not rolled individually; guaranteed-in-cycle is ignored with a warning.
  # Include desired IDs for a wave type: loot: [common_scroll, rare_scroll, legendary_scroll].
  # Only scrolls included in that wave type's loot table participate in the group.
  # A selected scroll with replaces-all: true suppresses all other loot.
  # Skin entries always give ONE authentic scroll; material/name/lore/min/max are ignored.
  # Missing/old QUACK or unknown skin ID: skip this item and log a warning.
  - material: CHAIN_COMMAND_BLOCK
    id: chrono_token
    item-model: wooden_hoe
    custom-model-data: chrono_token
    name: <gradient:#f7fdff:#0078ce><italic:false>Хроно-жетон</italic:false></gradient>
    lore:
      - <italic:false><gray>Можно обменять на:</gray>
      - <italic:false><gradient:#f7fdff:#0078ce>• Различная косметика</gradient>
      - <italic:false><gradient:#f7fdff:#0078ce>• Особые предметы</gradient>
    min: 1
    max: 3
    chance: 100
  - material: DEEPSLATE_DIAMOND_ORE
    id: ars
    min: 1
    max: 7
    chance: 20
    guaranteed-in-cycle: true
  - material: TORCHFLOWER_SEEDS
    id: shlak
    alternatives:
      - PITCHER_POD
    min: 2
    max: 4
    chance: 50
  - material: CAKE
    id: imba
    lore:
      - <italic:false><gray>• Торт - не ложь</gray>
    min: 1
    max: 1
    chance: 0.5
    replaces-all: true
  - material: TOTEM_OF_UNDYING
    id: totem
    min: 1
    max: 3
    chance: 100
  - material: CHAIN_COMMAND_BLOCK
    id: blueprint_guitar
    item-model: wooden_hoe
    custom-model-data: guitar_blueprint
    name: <white><italic:false>Схема создания</italic:false></white>
    lore:
      - <italic:false><gray>Можно использовать для:</gray>
      - <italic:false><light_purple>• Создания Боевой гитары</light_purple>
    min: 1
    max: 1
    chance: 75
  - material: CHAIN_COMMAND_BLOCK
    id: blueprint_heart
    item-model: wooden_hoe
    custom-model-data: stone_heart_blueprint
    name: <white><italic:false>Схема создания</italic:false></white>
    lore:
      - <italic:false><gray>Можно использовать для:</gray>
      - <italic:false><aqua>• Создания Окаменевшего сердца</aqua>
    min: 1
    max: 1
    chance: 50
  - material: CHAIN_COMMAND_BLOCK
    id: blueprint_reaper
    item-model: wooden_hoe
    custom-model-data: soul_reaper_scythe_blueprint
    name: <white><italic:false>Схема создания</italic:false></white>
    lore:
      - <italic:false><gray>Можно использовать для:</gray>
      - <italic:false><light_purple>• Создания Серп Урожая Душ</light_purple>
    min: 1
    max: 1
    chance: 50
  - material: CHAIN_COMMAND_BLOCK
    id: nitro_token
    item-model: wooden_hoe
    custom-model-data: nitro_token
    name: <gradient:#EA8D6E:#BF1F00><italic:false>Нитро-жетон</italic:false></gradient>
