sounds:
  # Звук нажатия на настоящую бумагу в меню калибровки (успех).
  # Имя можно писать как в конфиге ресурспака (block.note_block.bit) или как в Bukkit (BLOCK_NOTE_BLOCK_BIT).
  # Пустое значение — звук выключен.
  calibration-click: block.note_block.bit
  calibration-click-volume: 1
  calibration-click-pitch: 1.5
  # Звук нажатия на фейковую бумагу (промах: этап начинается заново).
  calibration-fake-click: block.note_block.bit
  calibration-fake-click-volume: 1
  calibration-fake-click-pitch: 0

  # Кастомные звуки ресурспака. Имя — путь звука из sounds.json вашего ресурспака с namespace,
  # например «towers:rift_close». Значения ниже — плейсхолдеры: замените их на свои id.
  # Пустое значение — звук выключен. Громкость и высота — ключами «-volume» и «-pitch».
  # Звук выполненного задания (последняя волна отбита).
  quest-complete: "quack_ambient:rift_end"
  quest-complete-volume: 10
  quest-complete-pitch: 1
  # Звук открывшегося разлома.
  rift-open: "quack_ambient:rift_open"
  rift-open-volume: 10
  rift-open-pitch: 1
  # Звук начала волны.
  wave-start: "quack_ambient:rift_wave"
  wave-start-volume: 10
  wave-start-pitch: 1
  # Звук закрытия разлома (когда разлом исчезает после волн, отмены или сброса).
  rift-close: "quack_ambient:rift_end"
  rift-close-volume: 10
  rift-close-pitch: 1
  # Амбиент разлома, пока он спит/открыт и волны ещё не начались.
  # Играется только владельцу, пока тот в радиусе 64 блоков от разлома.
  rift-ambient: "quack_ambient:rift"
  rift-ambient-volume: 10
  rift-ambient-pitch: 1
  # Звук боя: запускается при открытии разлома и останавливается при закрытии разлома.
  battle: "quack_ambient:rift_battle"
  battle-volume: 10
  battle-pitch: 1
  # Длительность ambient_rift в секундах: после неё амбиент запускается снова, пока разлом ждёт игрока.
  rift-ambient-interval-seconds: 44
  # Длительность battle-трека в секундах: после неё музыка перезапускается, пока идёт бой.
  battle-interval-seconds: 60

